<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8fd3ff">
    <title>Денежное дерево</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='20' y='26' width='8' height='16' rx='3' fill='%23a8703f'/%3E%3Ccircle cx='24' cy='20' r='14' fill='%236fcf4f'/%3E%3Ccircle cx='24' cy='20' r='6' fill='%23ffd23f'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="portrait on-title">
    <!-- Сад рисуется на холсте во весь экран, интерфейс лежит поверх -->
    <canvas id="scene"></canvas>

    <div id="app">
        <div id="hud">
            <div class="hud-left">
                <div class="pill coins">
                    <span id="coin-ico"></span>
                    <span><b class="num" id="coins">0</b><span class="sub" id="cps"></span></span>
                </div>
                <div class="pill seeds hidden">
                    <span id="seed-ico"></span><b class="num" id="seeds">0</b>
                </div>
            </div>
            <div class="hud-right">
                <button class="round-btn" id="btn-goals" aria-label="goals"></button>
                <button class="round-btn" id="btn-settings" aria-label="settings"></button>
            </div>
        </div>

        <div id="stage-chip"><span class="ci"></span><span class="cn"></span><span class="mini"><i></i></span></div>

        <div id="controls">
            <div id="status"></div>
            <button id="btn-rainbow"><span class="fill"></span><span class="label"></span></button>
        </div>

        <section id="panel">
            <div class="panel-head">
                <div class="grow panel-title"></div>
                <button class="round-btn close-btn" aria-label="close"></button>
            </div>
            <div class="panel-body"></div>
        </section>

        <nav id="tabs"></nav>

        <div id="modals"></div>
        <div id="toasts"></div>
        <div id="hint" class="hidden"></div>
        <div id="hand" class="hidden"></div>
    </div>

    <div id="title">
        <div class="logo">
            <h1>Денежное дерево</h1>
            <p></p>
        </div>
        <div class="title-bottom">
            <div id="loading-text">Загрузка…</div>
            <button id="btn-play" class="btn big hidden">Играть</button>
        </div>
    </div>

    <!-- Порядок важен: сначала базовые модули, потом логика, графика, интерфейс -->
    <script src="js/core/util.js"></script>
    <script src="js/core/i18n.js"></script>
    <script src="js/core/sdk.js"></script>
    <script src="js/core/audio.js"></script>
    <script src="js/game/config.js"></script>
    <script src="js/game/game.js"></script>
    <script src="js/game/meta.js"></script>
    <script src="js/game/save.js"></script>
    <script src="js/view/paint.js"></script>
    <script src="js/view/tree.js"></script>
    <script src="js/view/critters.js"></script>
    <script src="js/view/flowers.js"></script>
    <script src="js/view/scene.js"></script>
    <script src="js/ui/icons.js"></script>
    <script src="js/ui/ui.js"></script>
    <script src="js/ui/panels.js"></script>
    <script src="js/ui/hints.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
